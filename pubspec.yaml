name: tripavela
description: "Offline city adventures, discoveries and personal travel atlas."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  intl: ^0.20.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/data/cities/
    - lib/l10n/
  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText.ttf
